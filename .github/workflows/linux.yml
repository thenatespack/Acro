name: Linux

# Builds and runs the tests on the Vulkan backend with lavapipe (Mesa's software Vulkan) under a
# virtual X display. Demo scenes aren't rendered in CI; check rendering changes locally with
# Scripts/render-scenes.sh.
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container:
      # The toolchain the engine is developed with: 6.0 can't type-check Package.swift's
      # target list or compile EngineMCP's stdio code (Scripts/linux-docker-ci.sh runs this locally).
      image: swift:6.4-noble
    env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
      LIBGL_ALWAYS_SOFTWARE: "1"
      ENGINE_CRASH_DIR: crashes
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libvulkan-dev libglfw3-dev zlib1g-dev pkg-config glslc \
            mesa-vulkan-drivers xvfb xauth libasound2-dev ca-certificates

      - name: Build
        run: swift build -c release --product Demo

      - name: Test
        # Under a virtual display: the GPU tests (ComputeTests, FSR3Tests, ...) open a GLFW
        # window for the Vulkan device and run on lavapipe.
        run: xvfb-run -a -s "-screen 0 1280x720x24" swift test

      - name: Upload crash reports and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-crashes
          path: |
            .build/*.log
            crashes
          if-no-files-found: ignore

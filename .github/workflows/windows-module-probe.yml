name: Windows module probe

# Temporary: how SwiftPM builds a .dynamic library product on Windows, and whether a game DLL
# linked against its import library shares one copy of it with the host.
on:
  push:
    branches: [windows-game-modules]

jobs:
  probe:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build-system: [swiftbuild, native]
    steps:
      - uses: actions/checkout@v4

      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.4.2-release
          swift-build: 6.4.2-RELEASE

      - name: Probe
        shell: pwsh
        continue-on-error: true
        env:
          BS: ${{ matrix.build-system }}
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE probe-out
          New-Item -ItemType Directory $out | Out-Null
          Set-Location .github\module-probe\Core
          swift build --build-system $env:BS -v *> "$out\core.log"
          "core build exit: $LASTEXITCODE"
          Get-ChildItem .build -Recurse -File -Include *.dll, *.lib, *.exe | ForEach-Object FullName | Tee-Object "$out\core-files.txt"
          "Core compiled with -static: " + [bool](Select-String -Path "$out\core.log" -Pattern '-module-name Core .*-static' -Quiet)
          $inHost = Get-ChildItem .build -Recurse -Filter InHost.exe | Select-Object -First 1
          if ($inHost) {
            "InHost imports:"; & llvm-readobj --coff-imports $inHost.FullName | Select-String 'Name: .*\.dll'
            & $inHost.FullName; "InHost exit: $LASTEXITCODE"
          }

          Set-Location ..\Game
          swift build --build-system $env:BS -v *> "$out\game.log"
          "game build exit: $LASTEXITCODE"
          Get-ChildItem .build -Recurse -File -Include *.dll, *.lib, *.exe, *.o, *.obj | ForEach-Object FullName | Tee-Object "$out\game-files.txt"
          "Core compiled with -static (game pkg): " + [bool](Select-String -Path "$out\game.log" -Pattern '-module-name Core .*-static' -Quiet)
          "Game compiled with -static: " + [bool](Select-String -Path "$out\game.log" -Pattern '-module-name Game .*-static' -Quiet)
          $hostExe = Get-ChildItem .build -Recurse -Filter Host.exe | Select-Object -First 1
          "Host imports:"; & llvm-readobj --coff-imports $hostExe.FullName | Select-String 'Name: .*\.dll'
          $coreLib = Get-ChildItem .build -Recurse -Filter Core.lib | Select-Object -First 1
          "Core.lib: $($coreLib.FullName)"
          $objects = @(Get-ChildItem .build -Recurse -Include *.o | Where-Object { $_.FullName -match '[\\/]Game[^\\/]*\.build[\\/]|[\\/]Game\.o$|Game-t\.build' } | ForEach-Object FullName)
          "game objects: $($objects -join ', ')"
          swiftc -emit-library -o "$out\Game.dll" $objects $coreLib.FullName *> "$out\link.log"
          "link exit: $LASTEXITCODE"; Get-Content "$out\link.log" -Tail 40
          "Game.dll exports:"; & llvm-readobj --coff-exports "$out\Game.dll" | Select-String 'Name:'
          "Game.dll imports:"; & llvm-readobj --coff-imports "$out\Game.dll" | Select-String 'Name: .*\.dll'
          Set-Location $hostExe.DirectoryName
          & $hostExe.FullName "$out\Game.dll"
          "host exit: $LASTEXITCODE"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.build-system }}
          path: probe-out

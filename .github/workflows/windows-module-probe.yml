name: Windows module probe

# Temporary: how SwiftPM builds a .dynamic library product on Windows, and whether a game DLL
# linked against its import library shares one copy of it with the host.
on:
  push:
    branches: [windows-game-modules]

jobs:
  probe:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build-system: [swiftbuild, native]
    steps:
      - uses: actions/checkout@v4

      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.4.2-release
          swift-build: 6.4.2-RELEASE

      - name: Probe
        shell: pwsh
        continue-on-error: true
        env:
          BS: ${{ matrix.build-system }}
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE probe-out
          New-Item -ItemType Directory $out, "$out\A", "$out\B" | Out-Null
          Set-Location .github\module-probe\Core
          swift build --build-system $env:BS -v *> "$out\core.log"
          "core build exit: $LASTEXITCODE"
          $coreBin = (Resolve-Path .build\debug).Path
          "InHost exports: " + (& llvm-readobj --coff-exports "$coreBin\InHost.exe" | Select-String 'Name:').Count
          & llvm-readobj --coff-exports "$coreBin\InHost.exe" | Select-String 'Name:' | Select-Object -First 8

          Set-Location ..\Game
          swift build --build-system $env:BS -v *> "$out\game.log"
          "game build exit: $LASTEXITCODE"
          $bin = (Resolve-Path .build\debug).Path
          $objects = @()
          foreach ($folder in "Game.objlib", "Game.build") {
            if ($objects.Count -eq 0 -and (Test-Path "$bin\$folder")) {
              $objects = @(Get-ChildItem "$bin\$folder" -File | Where-Object { $_.Extension -in '.o', '.obj' } | ForEach-Object FullName)
            }
          }
          "game objects: $($objects -join ', ')"

          "--- A: game linked against Core.lib, loaded by Host (imports Core.dll)"
          swiftc -emit-library -o "$out\A\Game.dll" $objects "$bin\Core.lib" *> "$out\link-A.log"
          "link A exit: $LASTEXITCODE"; Get-Content "$out\link-A.log" -Tail 15
          "Game A imports:"; & llvm-readobj --coff-imports "$out\A\Game.dll" | Select-String 'Name: .*\.dll'
          & "$bin\Host.exe" "$out\A\Game.dll"; "host A exit: $LASTEXITCODE"

          "--- B: game linked against InHost.lib, loaded by InHost (embeds Core)"
          swiftc -emit-library -o "$out\B\Game.dll" $objects "$coreBin\InHost.lib" *> "$out\link-B.log"
          "link B exit: $LASTEXITCODE"; Get-Content "$out\link-B.log" -Tail 15
          "Game B imports:"; & llvm-readobj --coff-imports "$out\B\Game.dll" | Select-String 'Name: .*\.dll'
          & "$coreBin\InHost.exe" "$out\B\Game.dll"; "host B exit: $LASTEXITCODE"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.build-system }}
          path: probe-out

name: macOS

# Builds and runs the tests. Demo scenes aren't rendered in CI; check rendering changes locally
# with Scripts/render-scenes.sh.
on:
  push:
  pull_request:

jobs:
  build-and-test:
    # Xcode 27 (Swift 6.4), the toolchain the engine is developed with; macos-latest has Xcode 26.
    runs-on: xcode-27
    env:
      ENGINE_CRASH_DIR: crashes
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan (MoltenVK), GLFW and shader tools
        run: brew install vulkan-loader vulkan-headers molten-vk glfw shaderc pkgconf

      - name: Build
        run: swift build -c release --product Demo

      - name: Test
        run: swift test

      - name: Upload crash reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-crashes
          path: crashes
          if-no-files-found: ignore

name: Windows

# Builds everything in debug (the Release workflow builds the optimized editor: whole-module
# optimization of the big modules took this job 24 minutes); there is no GPU on the hosted
# runner, so the only things run are a game
# module load check (GameRunner --check: build, link against GameRunner.lib, LoadLibraryW)
# and an exported game started without Swift on Path (its DLLs must all be in its folder).
# Exporting compiles the whole engine a second time (the player links it statically, in its
# own build folder: ~15 minutes), so it runs on pushes to main (merges) and when run by hand,
# not on pull requests. The .build folder is kept in
# the Actions cache between runs, with the sources' times set to their last commits
# (Scripts/restore-mtimes.pl), so only changed modules are rebuilt.
# Runs on pushes to main and on pull requests, not on every branch or tag push: a pushed
# branch is tested through its PR, and a release tag points at a commit main already tested.
# Run it by hand on any branch from the Actions tab. A newer push to the same branch or PR
# cancels the run in progress.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # restore-mtimes.pl needs each file's last commit

      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.4.2-release
          swift-build: 6.4.2-RELEASE

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          Invoke-WebRequest https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe -OutFile vulkan-sdk.exe
          .\vulkan-sdk.exe --accept-licenses --default-answer --confirm-command install
          $sdk = (Get-ChildItem C:\VulkanSDK | Sort-Object Name -Descending | Select-Object -First 1).FullName
          "VULKAN_SDK=$sdk" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "$sdk\Bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install GLFW (prebuilt)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/glfw/glfw/releases/download/3.4/glfw-3.4.bin.WIN64.zip -OutFile glfw.zip
          Expand-Archive glfw.zip -DestinationPath $env:RUNNER_TEMP
          $dir = Join-Path $env:RUNNER_TEMP 'glfw-3.4.bin.WIN64'
          # The engine expects $GLFW_DIR\include and $GLFW_DIR\lib (static glfw3.lib, /MD).
          Copy-Item "$dir\lib-vc2022" "$dir\lib" -Recurse
          "GLFW_DIR=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Install zlib (vcpkg)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install zlib:x64-windows
          $dir = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed\x64-windows'
          # zlib 1.3.2+ names the import library z.lib; Windows/CZlib links "zlib".
          if (-not (Test-Path "$dir\lib\zlib.lib") -and (Test-Path "$dir\lib\z.lib")) {
            Copy-Item "$dir\lib\z.lib" "$dir\lib\zlib.lib"
          }
          Get-ChildItem "$dir\lib" -Filter *.lib | ForEach-Object { $_.Name }
          # The engine expects $ZLIB_DIR\include and $ZLIB_DIR\lib (zlib.lib); zlib1.dll must be on PATH to run.
          "ZLIB_DIR=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "$dir\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Restore source times
        shell: bash
        run: perl Scripts/restore-mtimes.pl

      - name: Restore the build folder
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          # .build\debug is a symlink to the triple folder; the cache stores it as a plain folder,
          # and then swift build can't relink it and the products land out of its reach.
          path: |
            .build
            !.build/debug
            !.build/release
          key: windows-swift6.4-debug-${{ hashFiles('Package.swift') }}-${{ github.sha }}
          restore-keys: windows-swift6.4-debug-${{ hashFiles('Package.swift') }}-

      - name: Build
        shell: cmd
        run: swift build

      # Saved right after the build, not at the end of the job: the next step's GameRunner.exe
      # rebuilds SampleGame into the same .build while it runs, and Windows can't replace a
      # running .exe, so a folder saved afterwards held a build database that called
      # GameRunner.exe built with the file gone. The next run skipped relinking it and failed.
      - name: Save the build folder
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .build
            !.build/debug
            !.build/release
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Load a game module
        shell: cmd
        run: |
          for /f "delims=" %%b in ('swift build --show-bin-path') do set BIN=%%b
          dir "%BIN%\GameRunner.exe" "%BIN%\GameRunner.lib"
          "%BIN%\GameRunner.exe" SampleGame --check
          if errorlevel 1 (
            echo Libraries the SampleGame objects ask for:
            for %%f in ("%BIN%\SampleGame.objlib\*.o" "%BIN%\SampleGame.build\*.o") do llvm-readobj --coff-directives "%%f"
            exit /b 1
          )

      # Build Game for Windows: cook SampleGame and build it into a folder with its .exe, pack and DLLs.
      - name: Export a game
        if: github.event_name != 'pull_request'
        shell: cmd
        # The debug editor from the Build step; the game itself is still built optimized.
        run: swift run Editor --build-game Projects\SampleGame --out "%RUNNER_TEMP%\export"

      # As on a player's PC: no Swift, vcpkg or Vulkan SDK on Path, so every DLL the .exe imports
      # has to be in its folder (or System32). --version exits before opening a window (no GPU here).
      # A missing DLL fails with 0xC0000135 (-1073741515).
      - name: Start the exported game without Swift on Path
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $game = Join-Path $env:RUNNER_TEMP 'export\SampleGame'
          Get-ChildItem $game | ForEach-Object { $_.Name }
          if (Test-Path "$game\run.sh") { throw "A Windows export has no run.sh" }
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
          & "$game\SampleGame.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "SampleGame.exe --version exited with $LASTEXITCODE" }

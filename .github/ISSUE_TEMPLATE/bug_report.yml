name: Bug report
description: Something in the engine, editor, or tools doesn't work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For security problems, don't open an issue; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps, scene, or code that shows the problem.
      placeholder: |
        1. swift run -c release Demo --scene shadows
        2. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Rendering
        - Editor
        - Builder tools
        - MCP / AI control
        - Assets and import
        - Physics, audio, or input
        - Game modules and hot reload
        - Packaging and export
        - Build or CI
        - Other
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Graphics backend
      options:
        - Metal
        - Vulkan
        - Not graphics-related
  - type: input
    id: version
    attributes:
      label: Acro version or commit
      description: Run `Scripts/version.sh`, or give the commit hash.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS version, Swift version (`swift --version`), and GPU.
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, or crash reports
      description: Paste console output or attach files. Crash reports go to the folder in ENGINE_CRASH_DIR when it is set.
      render: text
